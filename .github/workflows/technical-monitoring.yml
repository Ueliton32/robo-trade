name: Robô Trade — technical monitoring

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  validate-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx prisma validate
      - run: npm audit --audit-level=high
      - run: npm run build
